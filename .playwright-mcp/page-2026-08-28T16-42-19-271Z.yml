    - paragraph [ref=e897]:
      - strong [ref=e898]: 그림 2. λ-성능 지도 — MountainCar-v0 (보상이 희소한 환경)
    - paragraph [ref=e899]:
      - emphasis [ref=e900]: Fig. 2. Performance map over action cost λ on MountainCar-v0
    - paragraph [ref=e901]: 선은 IQM(사분위평균), 띠는 95% 계층 부트스트랩 신뢰구간(시드 10개). 검은 점선은 기준이 되는 최고 고정 규칙, 보라 일점쇄선은 λ마다 가장 센 규칙의 포락선이다.
    - paragraph [ref=e902]: 표에서 읽히는 사실은 다음과 같다.
    - paragraph [ref=e903]: · 표준 DQN은 λ=0에서도 pump 규칙을 이기지 못했다. 비용 때문이 아니라 학습된 정책 자체가 규칙보다 약하다는 뜻이다.
    - paragraph [ref=e904]: · Lazy-MDP는 λ=0에서도 pump 규칙을 이기지 못했다. 비용 때문이 아니라 학습된 정책 자체가 규칙보다 약하다는 뜻이다.
    - paragraph [ref=e905]: · TempoRL은 λ=0에서도 pump 규칙을 이기지 못했다. 비용 때문이 아니라 학습된 정책 자체가 규칙보다 약하다는 뜻이다.
    - paragraph [ref=e906]: "비용이 오를 때 실제로 행동을 아꼈는지는 행동 횟수로 확인된다: 표준 DQN 141.1회(λ=0) → 0.0회(λ=0.66), 100% 감소; TempoRL 122.6회(λ=0) → 0.0회(λ=0.66), 100% 감소; Lazy-MDP 125.2회(λ=0) → 0.0회(λ=0.66), 100% 감소."
