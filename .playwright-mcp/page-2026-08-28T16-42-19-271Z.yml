    - paragraph [ref=e279]: "지속망의 학습식은 Q_skip(s,a,j) ← Σ_{i<j} γ^i r_{t+i} + γ^j max_{a'} Q(s_{t+j}, a') 이다. 한 번의 결정으로 j스텝을 진행하므로, 같은 경험에서 더 짧은 길이의 학습 표본도 함께 뽑아 쓴다 (원 논문의 skip experience augmentation). 최대 지속 길이는 J = 10으로 두었다."
