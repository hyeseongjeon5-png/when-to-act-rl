    - paragraph [ref=e40]: 정의하고 두 가지 엄격도(신뢰구간 기준·점추정 기준)로 측정했다. 이것이 실무자가 찾는 "학습을 쓸 것인가 규칙을 쓸 것인가"의 판단선이다.
