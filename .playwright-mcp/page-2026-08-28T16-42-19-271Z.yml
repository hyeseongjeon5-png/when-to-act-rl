    - paragraph [ref=e145]:
      - strong [ref=e146]: Ⅲ. Proposed Method
    - paragraph [ref=e147]:
      - strong [ref=e148]: 1. 문제 정의 — 행동에 값을 매긴 마르코프 결정 과정
    - paragraph [ref=e149]: 실제 기계 제어에서 행동은 공짜가 아니다. 밸브를 여닫으면 부품이 닳고, 엔진을 켜면 연료가 들고, 원격 장비에 명령을 보내면 통신 자원을 쓴다. 그런데 표준 강화학습 문제 설정에는 이 비용이 없다. 그래서 학습된 정책은 "가만히 있어도 되는 순간"에도 계속 행동을 낸다.
    - paragraph [ref=e150]: 이 연구는 표준 MDP (S, A, P, r, γ)의 보상 함수에 행동 비용 항 하나만 더한다.
    - paragraph [ref=e151]: "· a_noop: 그 환경에서 \"아무것도 하지 않음\"에 해당하는 행동 (MountainCar는 가속 안 함=1, LunarLander는 엔진 끔=0)"
    - paragraph [ref=e152]: "· 1[·]: 조건이 참이면 1, 거짓이면 0"
    - paragraph [ref=e153]:
      - text: "· λ ≥ 0: 행동 1번의 값."
      - strong [ref=e154]: 이 연구의 유일한 조절 손잡이
    - paragraph [ref=e155]:
      - text: 말로 풀면 이렇다. 게임 컨트롤러의 버튼을 누를 때마다 동전 λ개를 낸다. 아무 버튼도 안 누르면 공짜다. λ=0이면 원래 문제와 완전히 같고, λ가 아주 크면 "아무것도 안 하기"가 최적이 된다. 연구 질문은
      - strong [ref=e156]: 그 사이 어디에 경계가 있는가
      - text: 이다.
    - paragraph [ref=e157]:
      - strong [ref=e158]: 비용 부과 방식에 대한 결정
    - paragraph [ref=e159]:
      - text: 행동을 여러 스텝 유지하는 방식(TempoRL)에서는 "언제 비용을 물릴 것인가"가 갈린다. ① 행동을 새로
      - strong [ref=e160]: 결정한 시점에 1번만
      - text: (전환 비용 해석) ②
      - strong [ref=e161]: 유지되는 매 스텝마다
      - text: (작동 비용 해석).
    - paragraph [ref=e162]:
      - text: 이 연구는
      - strong [ref=e163]: ②를 채택한다.
      - text: 이유는 공정성이다. ①을 택하면 TempoRL 계열만 한 번의 결정으로 여러 스텝을 사실상 공짜로 쓰게 되어, 계열 간 성능 차이가 방법의 차이인지 비용 규칙의 차이인지 구분할 수 없게 된다. ②에서는 세 계열 모두 "no-op을 고르는 것"으로만 비용을 아낄 수 있어 규칙이 완전히 같다. ①(전환 비용 해석)은 민감도 분석 항목으로 남긴다.
