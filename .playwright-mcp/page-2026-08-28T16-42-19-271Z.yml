    - paragraph [ref=e1485]:
      - strong [ref=e1486]: Ⅴ. Conclusions
    - paragraph [ref=e1487]:
      - strong [ref=e1488]: 1. 무엇을 했고 무엇을 알아냈나
    - paragraph [ref=e1489]: 이 연구는 행동 1번의 비용 λ를 독립 변수로 놓고, 표준 DQN·TempoRL 방식·Lazy-MDP 방식·고정 규칙 네 계열을 같은 환경 스텝 예산과 같은 평가 방식으로 비교했다. 얻은 것은 세 가지다.
    - paragraph [ref=e1490]: "**첫째, λ-성능 지도와 임계 비용 λ\\*.** 두 환경에서 λ를 격자로 훑어, 비용이 오를 때 각 계열의 성능이 어떻게 무너지는지를 신뢰구간과 함께 그렸다. λ\\*는 \"학습을 도입할 것인가, 지금 쓰는 규칙으로 버틸 것인가\"를 가르는 판단선이 된다."
    - paragraph [ref=e1491]:
      - strong [ref=e1492]: 둘째, 답은 λ 하나로 정해지지 않는다.
      - text: 이 연구가 처음 세운 가설은 "비용이 커질수록 학습이 불리해지고, 어느 지점에서 규칙에 역전당한다"였다. 절반만 맞았다. 역전은 실제로 일어났지만
      - strong [ref=e1493]: 역전이 일어나는 지점이 환경마다 크게 달랐고, 그 차이를 만든 것은 비용이 아니라 환경의 성질
      - text: 이었다. 보상이 조밀한 환경에서는 행동이 상당히 비싸질 때까지 학습이 규칙을 이겼고, 보상이 희소하고 이미 좋은 규칙이 있는 환경에서는 비용이 없을 때조차 학습이 규칙을 이기지 못했다.
    - paragraph [ref=e1494]:
      - strong [ref=e1495]: 셋째, 무행동 붕괴는 최적해가 아니라 탐험 실패다.
      - text: 희소 보상 환경에서는 에피소드 보상의 1% 수준밖에 안 되는 작은 비용만으로도 세 계열 모두 행동을 멈추고 그대로 굳었다. 비용을 처음부터 물리지 않고 학습 도중에 켜는 대조 실험으로, 이것이 "비용을 감안하면 가만히 있는 것이 정말 최적"이라서가 아니라
      - strong [ref=e1496]: 비용 때문에 목표를 한 번도 보지 못해서
      - text: 생긴 결과임을 확인했다.
    - paragraph [ref=e1497]:
      - strong [ref=e1498]: 2. 실무자를 위한 정리
    - paragraph [ref=e1499]: 이 연구의 결과를 현장의 판단 순서로 옮기면 다음과 같다.
    - paragraph [ref=e1500]:
      - text: · 1.
      - strong [ref=e1501]: 먼저 환경을 보라.
      - text: 보상 신호가 조밀한가? 이미 잘 도는 규칙이 있는가? 보상이 희소하고
    - paragraph [ref=e1502]: 좋은 규칙이 있다면, 행동 비용을 재기 전에 이미 답이 정해져 있을 가능성이 높다 — 규칙을 쓰라.
    - paragraph [ref=e1503]:
      - text: · 2.
      - strong [ref=e1504]: 학습을 쓰기로 했다면 밑바닥이 있는 구조를 골라라.
      - text: Lazy-MDP 방식은 학습이 실패해도 기본
    - paragraph [ref=e1505]: 규칙 수준으로 떨어질 뿐이어서, 두 환경 모두에서 가장 안정적이었다.
    - paragraph [ref=e1506]:
      - text: · 3.
      - strong [ref=e1507]: 비용을 처음부터 물리지 마라.
      - text: 비용 없이 먼저 문제를 풀게 한 뒤 비용을 켜는 편이,
    - paragraph [ref=e1508]: 처음부터 비용을 물리는 것보다 낫다. 처음부터 물리면 탐험 자체가 막힌다.
    - paragraph [ref=e1509]:
      - strong [ref=e1510]: 3. 한계
    - paragraph [ref=e1511]: 정직하게 적어 둔다.
    - paragraph [ref=e1512]:
      - text: ·
      - strong [ref=e1513]: 환경이 둘뿐이다.
      - text: MountainCar와 LunarLander는 성질이 대조적이라는 점에서 잘 고른 짝이지만,
    - paragraph [ref=e1514]: 두 점으로 그은 선을 일반 법칙이라고 말할 수는 없다. "보상 조밀도가 λ\*를 결정한다"는 주장은 더 많은 환경에서 확인되어야 한다.
    - paragraph [ref=e1515]:
      - text: ·
      - strong [ref=e1516]: 비용 부과 방식이 하나다.
      - text: 이 연구는 행동이 실행되는
      - strong [ref=e1517]: 매 스텝
      - text: 비용을 물린다(작동 비용).
    - paragraph [ref=e1518]:
      - text: 행동을 새로
      - strong [ref=e1519]: 결정할 때 1번만
      - text: 무는 해석(전환 비용)에서는 TempoRL 계열이 유리해질 수 있다. 공정 비교를 지키려고 한 가지 방식으로 고정했으나, 다른 방식은 다른 지도를 그릴 것이다.
    - paragraph [ref=e1520]:
      - text: ·
      - strong [ref=e1521]: 예산이 크지 않다.
      - text: 개인 PC 12코어로 돌 수 있는 규모에 맞춰 조건당 환경 20만~30만 스텝을 썼다.
    - paragraph [ref=e1522]: 더 긴 예산에서는 학습 쪽이 유리해진다는 것을 공정성 점검에서 실제로 확인했다.
    - paragraph [ref=e1523]:
      - text: ·
      - strong [ref=e1524]: 행동 비용을 모든 행동에 똑같이 매겼다.
      - text: 실제 설비에서는 행동마다 마모 비용이 다르다.
    - paragraph [ref=e1525]: 행동별 λ를 쓰는 확장은 래퍼 한 줄이면 되지만 이 연구에서는 다루지 않았다.
    - paragraph [ref=e1526]:
      - strong [ref=e1527]: 4. 다음 연구
    - paragraph [ref=e1528]: · **환경 수를 늘려 '보상 조밀도 → λ\*' 관계를 검증한다.** 보상 조밀도를 정량화하는 지표를 정의하고
    - paragraph [ref=e1529]: 여러 환경의 λ\*와 상관을 보는 것이 자연스러운 다음 단계다.
    - paragraph [ref=e1530]:
      - text: ·
      - strong [ref=e1531]: 전환 비용 해석을 별도 축으로 보고한다.
      - text: 래퍼에 방식 플래그 하나를 더하면 되고,
    - paragraph [ref=e1532]: TempoRL 계열의 이점이 어느 정도인지 정량화할 수 있다.
    - paragraph [ref=e1533]:
      - text: ·
      - strong [ref=e1534]: 비용 일정(cost schedule)을 설계 변수로 삼는다.
      - text: 이 연구의 대조 실험은 "비용을 나중에 켜면
    - paragraph [ref=e1535]: 낫다"는 것을 보였다. 그렇다면 비용을 언제 얼마나 올릴지가 그 자체로 조절 대상이 된다.
