    - paragraph [ref=e9]:
      - strong [ref=e10]: Abstract
    - paragraph [ref=e11]: 행동에는 값이 붙는다. 기계를 한 번 움직일 때마다 부품이 닳고 연료가 든다. 그러나 표준 강화학습은 이 값을 0으로 두므로, 학습된 정책은 가만히 있어도 되는 순간에도 매 스텝 행동한다. 기존 연구는 행동을 아끼는 방법을 제시했으나 행동 비용의 크기를 바꿔 가며 성능을 재지는 않았다. 본 연구는 보상을 r′ = r − λ·1[행동 실행]로 바꾸어 행동 1회의 비용 λ를 독립 변수로 삼고, 표준 DQN·TempoRL 방식·Lazy-MDP 방식·고정 규칙 네 계열을 동일한 환경 스텝 예산과 동일한 평가 방식으로 비교하였다. 두 환경에서 시드 10개·IQM·95% 계층 부트스트랩 신뢰구간으로 집계한 결과, 학습이 규칙을 더 이상 이기지 못하는 임계 비용 λ*는 두 환경에서 크게 달랐다. 즉 학습을 도입할 가치는 비용의 크기보다 보상이 조밀한지, 그리고 이미 좋은 고정 규칙이 있는지에 먼저 좌우된다. 또한 보상이 희소한 환경에서는 작은 비용만으로 학습이 무행동으로 얼어붙었고, 비용을 나중에 부과하는 대조 실험으로 이것이 최적해가 아니라 탐험 실패임을 확인하였다.
    - paragraph [ref=e12]:
      - strong [ref=e13]: "Keyword : 강화학습, 행동 비용, 임계 비용, 무행동 붕괴, 통계적 평가 프로토콜"
    - paragraph [ref=e14]:
