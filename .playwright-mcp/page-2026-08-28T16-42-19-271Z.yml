    - paragraph [ref=e16]: 기계를 움직이는 일에는 값이 붙는다. 밸브를 한 번 여닫으면 부품이 그만큼 닳고, 엔진을 한 번 켜면 연료가 들며, 원격 장비에 명령을 한 번 보내면 통신 자원과 배터리를 쓴다. 사람이 만든 제어 규칙은 이 사실을 알고 있어서 "굳이 지금 손댈 필요가 없으면 가만히 둔다."
    - paragraph [ref=e17]:
      - text: 그런데 표준 강화학습(RL)의 문제 설정에는 이 값이 없다. 보상 함수 r(s, a)는 행동을 냈다는 사실 자체에 아무런 대가를 매기지 않는다. 그 결과 학습된 정책은
      - strong [ref=e18]: 매 스텝 무언가를 한다.
      - text: 가만히 있어도 되는 순간에도 행동을 낸다. 시뮬레이터 안에서는 이것이 손해가 아니지만, 실제 장비에서는 마모·연료·통신량으로 곧바로 돌아온다.
    - paragraph [ref=e19]:
      - text: 이 빈틈을 메우려는 연구가 이미 있다. TempoRL
      - superscript [ref=e20]: "[1]"
      - text: 은 "무엇을 할지"에 더해 "그 행동을 몇 스텝 유지할지"를 함께 배우게 했고, Lazy-MDP
      - superscript [ref=e21]: "[2]"
      - text: 는 행동 집합에 "기본 정책에 맡기기"라는 선택지를 넣어 "언제 끼어들지"를 배우게 했다. 두 연구 모두
      - strong [ref=e22]: 행동 횟수를 줄이는 방법
      - text: 을 제시했다는 점에서 이 문제를 정면으로 다룬다.
    - paragraph [ref=e23]:
      - text: 다만 두 연구가 답하지 않은 질문이 하나 남는다.
      - strong [ref=e24]: 행동 1번이 얼마나 비쌀 때
      - text: 이런 방법이 쓸모가 있는가? TempoRL은 학습 속도와 탐험 효율을 보였고, Lazy-MDP는 해석 가능성(어느 상태에서 개입했는가)을 보였다. 둘 다 행동 비용의
      - strong [ref=e25]: 크기를 바꿔 가며
      - text: 성능을 재지는 않았다. 즉 비용은 암묵적으로 0으로 고정돼 있었다.
    - paragraph [ref=e26]:
      - text: 이것이 현장에서는 곧바로 문제가 된다. 실무자가 묻는 것은 "행동을 줄이는 법이 있는가"가 아니라
      - strong [ref=e27]: "\"우리 설비의 마모 비용 정도면, 학습을 도입할 값이 있는가 아니면 지금 쓰는 규칙이면 충분한가\""
      - text: 이기 때문이다. 이 질문에 답하려면 비용을 눈금이 있는 축으로 만들어야 한다.
