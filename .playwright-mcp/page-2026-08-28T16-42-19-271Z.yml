    - paragraph [ref=e1240]:
      - strong [ref=e1241]: 그림 3. λ-성능 지도 — LunarLander-v3 (보상이 조밀한 환경)
    - paragraph [ref=e1242]:
      - emphasis [ref=e1243]: Fig. 3. Performance map over action cost λ on LunarLander-v3
    - paragraph [ref=e1244]: 선은 IQM(사분위평균), 띠는 95% 계층 부트스트랩 신뢰구간(시드 10개). 검은 점선은 기준이 되는 최고 고정 규칙, 보라 일점쇄선은 λ마다 가장 센 규칙의 포락선이다.
    - paragraph [ref=e1245]: 표에서 읽히는 사실은 다음과 같다.
    - paragraph [ref=e1246]: · 표준 DQN은 비교된 λ 구간 전체(8/8 λ)에서 임계값 규칙을 이겼다.
    - paragraph [ref=e1247]: · Lazy-MDP는 비교된 λ 구간 전체(8/8 λ)에서 임계값 규칙을 이겼다.
    - paragraph [ref=e1248]: · TempoRL은 비교된 λ 구간 전체(8/8 λ)에서 임계값 규칙을 이겼다.
    - paragraph [ref=e1249]: "비용이 오를 때 실제로 행동을 아꼈는지는 행동 횟수로 확인된다: 표준 DQN 340.8회(λ=0) → 63.4회(λ=3), 81% 감소; TempoRL 406.5회(λ=0) → 97.8회(λ=3), 76% 감소; Lazy-MDP 246.6회(λ=0) → 37.5회(λ=3), 85% 감소."
