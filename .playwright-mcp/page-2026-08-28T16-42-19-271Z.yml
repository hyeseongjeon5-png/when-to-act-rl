    - paragraph [ref=e480]:
      - text: ·
      - strong [ref=e481]: λ
      - text: ": 행동 1번의 값. 오른쪽(아래쪽)으로 갈수록 행동이 비싸다. λ=0이면 원래 문제와 같다."
    - paragraph [ref=e482]:
      - text: ·
      - strong [ref=e483]: r′
      - text: ": 비용까지 빼고 남은 총보상. 높을수록 좋다."
    - paragraph [ref=e484]:
      - text: ·
      - strong [ref=e485]: 대괄호
      - text: ": 95% 계층 부트스트랩 신뢰구간. 두 구간이 겹치면 우열을 말하지 않는다."
    - paragraph [ref=e486]:
      - text: ·
      - strong [ref=e487]: 기준 규칙
      - text: ": 각 환경에서 가장 센 고정 규칙(MountainCar는 pump, LunarLander는 임계값). 문제를 아예 못 푸는 약한 규칙을 기준으로 삼으면 \"학습이 이겼다\"가 너무 쉬워진다."
    - paragraph [ref=e488]:
      - text: ·
      - strong [ref=e489]: 최강 규칙
      - text: ": λ마다 그 시점에서 가장 센 고정 규칙을 골라 이은 포락선. 비용이 커지면 최강 규칙이 무행동으로 바뀌기 때문에 이 보조선을 함께 본다."
    - paragraph [ref=e490]:
      - text: ·
      - strong [ref=e491]: λ\
      - text: "*: 학습이 규칙을 더 이상 이기지 못하게 되는 가장 작은 λ. 격자 안에서 교차가 없으면 보간하지 않고 그 사실을 그대로 적는다."
