    - paragraph [ref=e1406]:
      - strong [ref=e1407]: 5. 무행동 붕괴 — 아주 작은 비용에서 학습이 멈춘다
    - paragraph [ref=e1408]: MountainCar에서는 비용이 조금만 붙어도 세 계열 모두 행동을 멈추고 그 상태로 굳는다. λ를 0 부근에서 촘촘히 훑어 그 문턱이 어디인지 쟀다.
    - paragraph [ref=e1409]
    - paragraph [ref=e1411]:
      - strong [ref=e1412]: 그림 4. 무행동 붕괴 — 비용이 조금만 붙어도 행동을 멈춘다 (MountainCar-v0)
    - paragraph [ref=e1413]:
      - emphasis [ref=e1414]: "Fig. 4. Collapse to inaction: action count and success rate versus action cost λ on MountainCar-v0"
    - paragraph [ref=e1415]: 가로축은 λ=0 부근을 넓혀 보기 위해 대칭 로그 축(linthresh=0.001)을 썼다. 왼쪽은 에피소드당 행동 횟수, 오른쪽은 목표 도달률이다.
    - paragraph [ref=e1416]: "· 표준 DQN: 행동 횟수가 절반 아래로 떨어지는 첫 λ = 0.01, 완전히 0이 되는 첫 λ = 0.03"
    - paragraph [ref=e1417]: "· TempoRL: 행동 횟수가 절반 아래로 떨어지는 첫 λ = 0.01, 완전히 0이 되는 첫 λ = 0.03"
    - paragraph [ref=e1418]: "· Lazy-MDP: 행동 횟수가 절반 아래로 떨어지는 첫 λ = 0.05, 완전히 0이 되는 첫 λ = 0.2"
    - paragraph [ref=e1419]: 이 문턱은 에피소드 보상 규모에 견주면 매우 작다. MountainCar의 한 에피소드 보상은 −200에서 −120 사이인데, 행동 1번의 값이 그 1% 수준만 되어도 학습은 행동을 포기한다.
    - paragraph [ref=e1420]:
      - strong [ref=e1421]: 6. 공정성 점검 — 비용이 없을 때 학습은 규칙 수준에 닿는가
    - paragraph [ref=e1422]: MountainCar에서 λ*가 0으로 나왔다는 것은 "비용이 없어도 학습이 규칙에 진다"는 뜻이다. 그렇다면 이 결과는 비용에 대한 발견이 아니라 학습이 덜 됐다는 신호일 수 있다. 그래서 학습 예산과 탐험 설정을 바꿔 가며 λ=0 성능을 다시 쟀다.
    - paragraph [ref=e1423]:
      - strong [ref=e1424]: 표 3. 공정성 점검 — 비용이 없을 때(λ=0) 학습은 규칙 수준에 닿는가 (MountainCar-v0)
    - paragraph [ref=e1425]:
      - emphasis [ref=e1426]: "Table 3. Fairness check: can learning reach rule-level performance at zero cost (λ=0) on MountainCar-v0"
