    - paragraph [ref=e45]:
      - strong [ref=e46]: 2. 미리 밝히는 결론
    - paragraph [ref=e47]:
      - text: 가장 중요한 결과는 기대와 달랐다.
      - strong [ref=e48]: 답은 λ 하나로 정해지지 않는다.
      - text: 두 환경에서 λ\*가 0과 2.0으로 갈렸는데, 갈린 이유는 비용의 크기가 아니라 환경의 성질 —
      - strong [ref=e49]: 보상이 조밀한가, 그리고 이미 좋은 고정 규칙이 있는가
      - text: — 였다. 보상이 희소하고 좋은 규칙이 있는 MountainCar에서는 비용이 0일 때조차 학습이 규칙을 이기지 못했고, 보상이 조밀한 LunarLander에서는 행동이 상당히 비싸질 때까지 학습이 규칙을 이겼다.
    - paragraph [ref=e50]:
      - text: 이 결과는 이 연구의 처음 가설("비용이 커질수록 학습이 불리해진다")보다 실무에 더 쓸모가 있다. 비용을 재기 전에
      - strong [ref=e51]: 환경을 먼저 보라
      - text: 는 뜻이기 때문이다.
    - paragraph [ref=e52]:
      - strong [ref=e53]: 3. 논문의 구성
    - paragraph [ref=e54]: Ⅱ장에서 TempoRL·Lazy-MDP와 평가 프로토콜을 정리하고 이 연구가 메우는 빈틈을 밝힌다. Ⅲ장에서 비용 래퍼와 비교 4계열, 공정 비교 조건, λ\*의 정의를 기술한다. Ⅳ장에서 λ-성능 지도와 임계 비용 표, 무행동 붕괴 분석을 제시한다. Ⅴ장에서 결론과 한계를 정리한다.
    - paragraph [ref=e55]:
      - strong [ref=e56]: Ⅱ. Related Works
    - paragraph [ref=e57]:
      - strong [ref=e58]: 1. TempoRL — 얼마나 오래 할지를 배운다
    - paragraph [ref=e59]:
      - text: Biedenkapp 등
      - superscript [ref=e60]: "[1]"
      - text: 은 표준 강화학습이 매 스텝 행동을 새로 고르는 것을 낭비로 보았다. 사람은 "오른쪽으로 계속 밀기"처럼 하나의 결정을 한동안 유지한다. 이들은 신경망을 둘로 나눠
      - strong [ref=e61]: 행동망
      - text: Q(s, a)가 무엇을 할지를,
      - strong [ref=e62]: 지속망
      - text: Q_skip(s, a, j)가 그 행동을 몇 스텝 유지할지(j = 1…J)를 배우게 했다.
    - paragraph [ref=e63]:
      - text: "지속망의 학습식은 Q_skip(s,a,j) ← Σ_{i<j} γ^i r_{t+i} + γ^j max_{a'} Q(s_{t+j}, a') 이며, 한 번의 경험에서 더 짧은 길이의 표본도 함께 뽑아 쓰는 기법(skip experience augmentation)으로 표본 효율을 높였다. 저자들은 MountainCar처럼 보상이 희소한 문제에서 이 방식이 표준 DQN보다 훨씬 빨리 배운다는 것을 보였다. 행동을 오래 유지하면 상태 공간을 더 멀리까지 훑게 되어"
      - strong [ref=e64]: 탐험이 좋아지기
      - text: 때문이다.
    - paragraph [ref=e65]: "이 연구와의 관계: TempoRL의 목표는 학습 속도였고, 행동 횟수 감소는 그 부산물이었다. 행동 1번의 값을 매겨 놓고 \"그 값이 얼마일 때 이 방법이 이득인가\"를 묻지는 않았다."
    - paragraph [ref=e66]:
      - strong [ref=e67]: 2. Lazy-MDP — 언제 끼어들지를 배운다
    - paragraph [ref=e68]:
      - text: Jacq 등
      - superscript [ref=e69]: "[2]"
      - text: 은 다른 길로 접근했다. 이미 쓸 만한
      - strong [ref=e70]: 기본 정책
      - text: (사람이 만든 규칙이나 기존 컨트롤러)이 있다고 보고, 에이전트의 행동 집합에 "이번 스텝은 기본 정책에 맡긴다"는 선택지를 하나 더 붙인다. 에이전트가 직접 개입할 때마다 벌점 η를 물리면, 학습된 정책은
      - strong [ref=e71]: 꼭 필요한 상태에서만 개입
      - text: 하게 된다.
    - paragraph [ref=e72]: 저자들은 이 구조의 이점을 해석 가능성에서 찾았다. 개입한 상태들만 모아 보면 "이 문제에서 중요한 순간이 어디인가"가 사람 눈에 보인다는 것이다. 또한 기본 정책이 밑바닥 성능을 보장하므로 학습이 실패해도 완전히 무너지지 않는다는 실용적 장점이 있다.
    - paragraph [ref=e73]:
      - text: "이 연구와의 관계: Lazy-MDP의 η는 \"개입\"에 붙는 벌점이지"
      - strong [ref=e74]: 환경이 물리는 행동 비용
      - text: 이 아니다. η는 해석 가능성을 조절하는 손잡이로 쓰였고, 환경의 보상 자체를 바꾸지는 않았다.
    - paragraph [ref=e75]:
      - strong [ref=e76]: 3. 통계적으로 믿을 수 있는 비교 — rliable 프로토콜
    - paragraph [ref=e77]:
      - text: Agarwal 등
      - superscript [ref=e78]: "[3]"
      - text: 은 심층 강화학습 논문들이 시드 3~5개의 평균으로 우열을 선언해 왔고, 그 결론의 상당수가 시드를 늘리면 뒤집힌다는 것을 보였다. 대안으로 이들은 ① 대푯값을 평균이 아니라
      - strong [ref=e79]: IQM(사분위평균 — 위아래 25%를 버리고 가운데 50%만 평균)
      - text: 으로 잡고 ②
      - strong [ref=e80]: 계층 부트스트랩 신뢰구간
      - text: 을 함께 보고할 것을 제안했다.
    - paragraph [ref=e81]:
      - text: 이 연구는 이 프로토콜을 그대로 따른다. 조건마다 시드 10개를 돌리고, 모든 수치를 IQM과 95% 신뢰구간으로 보고하며,
      - strong [ref=e82]: 신뢰구간이 겹치면 우열을 말하지 않는다.
      - text: 실제로 이 원칙이 결론을 바꾼 사례가 있었다 — 시드 0 하나만 보면 TempoRL이 MountainCar에서 가장 좋았지만, 시드 10개로는 순위가 뒤집혔다. 이 기록은 docs/실험일지.md에 남아 있다.
