      - text: 하이퍼파라미터는 우리가 고른 값이 아니라 TempoRL 공개 구현(automl/TempoRL, run_featurized_experiments.py, 2026-08-24 확인)의 기본값을 그대로 옮긴 것이다. 우리가 정한 값을 쓰면 "어느 계열에 유리하게 맞춘 것 아니냐"는 의심을 피할 수 없기 때문이다. 세 계열은 이 값을
      - strong [ref=e417]: 완전히 동일하게
      - text: 쓰며, 계열 간 차이는 오직 '한 번의 결정이 환경을 몇 스텝 진행시키는가'와 '행동 집합에 기본 정책 위임이 있는가'뿐이다.
    - paragraph [ref=e418]: 마지막 항목이 특히 중요하다. TempoRL은 한 번의 결정으로 여러 스텝을 진행하므로 "결정 횟수"로 예산을 세면 다른 계열보다 훨씬 많은 환경 경험을 얻는다. 그래서 예산은 환경 스텝 수로 세고, 학습 갱신 횟수도 소비한 환경 스텝 수에 비례시킨다.
    - paragraph [ref=e419]:
      - text: 평가는 모든 계열·규칙에서 동일하다.
      - strong [ref=e420]: 탐험을 끈 상태(greedy)
      - text: 로 재며, 평가 시드는 계열과 무관하게 같은 값(500000 + 시드×1000 + i)을 쓴다. 고정 규칙도 같은 평가 시드로, 같은 파일 구조로 기록해 집계 코드가 규칙과 학습을 구분 없이 다룬다.
    - paragraph [ref=e421]:
      - text: 학습 계열의 최종 점수는
      - strong [ref=e422]: 한 시점이 아니라 예산의 90%·95%·100% 세 시점 정책을 각각 50 에피소드씩 평가해 합친 150 에피소드
      - text: "의 평균이다. 파일럿에서 정책이 평가 시점마다 두 상태를 오가는 경우가 관찰됐기 때문이다(예: MountainCar의 Lazy-MDP가 '규칙에 위임(−119)'과 '직접 우가속(−200)' 사이를 손실이 0에 수렴한 채 왕복). Q값이 거의 동률이라 argmax가 뒤집히는 것인데, 한 시점만 재면 최종 점수가 동전 던지기가 된다. 학습이 없는 고정 규칙은 이런 진동이 없으므로 시드당 100 에피소드로 잰다."
    - paragraph [ref=e423]:
      - strong [ref=e424]: 5. 통계 처리
    - paragraph [ref=e425]: Agarwal et al. (2021)의 프로토콜을 따른다.
    - paragraph [ref=e426]:
      - text: · 계열·λ 조합마다
      - strong [ref=e427]: 시드 10개
      - text: . 시드 1개의 점수 = 최종 평가 에피소드(학습 150 / 규칙 100)의 평균
    - paragraph [ref=e428]:
      - text: · 대푯값은 평균이 아니라
      - strong [ref=e429]: IQM(사분위평균)
      - text: — 위아래 25%를 버리고 가운데 50%만 평균 낸다.
    - paragraph [ref=e430]: 시드 몇 개가 유난히 잘되거나 못되는 강화학습 특유의 산포에 덜 흔들린다
    - paragraph [ref=e431]:
      - text: ·
      - strong [ref=e432]: 95% 계층 부트스트랩 신뢰구간
      - text: 을 함께 보고한다 (rliable). 구간이 겹치면 우열을 말하지 않는다
    - paragraph [ref=e433]:
